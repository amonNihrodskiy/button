<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лишь для тебя одной</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap">
<style>
:root{--paper:#fbfaf4;--ink:#2a2b4f;--dim:rgba(42,43,79,.62);--bar:rgba(255,255,255,.85);--line:rgba(42,43,79,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 3.5%);text-align:center;font-size:clamp(22px,4.4vw,32px);color:var(--dim);pointer-events:none;padding:0 60px;transition:opacity .6s}
#cap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);text-align:center;font-size:clamp(28px,6vw,46px);padding:0 16px;opacity:0;transition:opacity 1s;pointer-events:none}
#cap.on{opacity:1}
#cap.big{bottom:auto;top:34%;font-size:clamp(36px,8vw,70px);line-height:1.15}
#next{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);font:inherit;font-size:18px;color:var(--ink);background:var(--bar);border:1.5px solid var(--ink);border-radius:999px;padding:13px 34px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s}
#next.on{opacity:1;pointer-events:auto}
#snd{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 10px);width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bar);color:var(--ink);font-size:18px;cursor:pointer}
#next:focus-visible,#snd:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion: reduce){#hint,#cap,#next{transition:none}}
#menuB{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 10px);width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bar);color:var(--ink);font-size:18px;cursor:pointer}
#menuB:focus-visible,#mclose:focus-visible,.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#menu{position:fixed;inset:0;z-index:20;background:rgba(251,250,244,.98);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 22px);display:none}
#menu.on{display:block}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:920px;margin:0 auto 14px}
.mh h2{margin:0;font-size:clamp(28px,6vw,40px)}
.mh small{display:block;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-weight:400;font-size:14px;color:var(--dim);margin-top:2px}
#mclose{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bar);color:var(--ink);font-size:18px;cursor:pointer}
.grid{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:6px 6px 8px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.card canvas{position:static;inset:auto;width:100%;height:auto;aspect-ratio:1/1;display:block;pointer-events:none}
.card span{font-size:12px;line-height:1.25;text-align:center;color:var(--dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.75em}
.card.locked{cursor:default;background:#f6f6fa}
.card:not(.locked):hover{border-color:var(--ink)}
#letter{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(42,43,79,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:pan-y}
#letter.on{display:flex}
#lcard{width:min(100%,520px);max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:#fffaf0;border:1.5px solid #a8743a;border-radius:18px;padding:26px 24px 22px;box-shadow:0 18px 50px rgba(0,0,0,.25);animation:lin .7s ease both}
@keyframes lin{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
#lcard h2{margin:0 0 14px;font-size:clamp(32px,7.5vw,42px);color:#7a4a2b;font-weight:600}
#lcard p{margin:0 0 12px;font-size:clamp(20px,4.8vw,25px);line-height:1.45;color:var(--ink)}
#lcard p.lsign{text-align:right;margin-top:18px;color:#7a4a2b}
#lclose{display:block;margin:18px auto 0;font:inherit;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-style:normal;font-size:17px;color:var(--ink);background:var(--bar);border:1.5px solid var(--ink);border-radius:999px;padding:12px 34px;cursor:pointer}
#lclose:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion: reduce){#lcard{animation:none}}
</style>
</head>

    gn.gain.setValueAtTime(.0001,n); gn.gain.exponentialRampToValueAtTime(v*m,n+.006); gn.gain.exponentialRampToValueAtTime(.0001,n+d); o.connect(gn); gn.connect(AC.destination); o.start(n); o.stop(n+d+.05); }); }

function complete(){
  phase='done'; ft=0; setHint('');

  if(cur!==LETTER&&unlock(cur)) setHint('Новый рисунок открыт — смотри в меню ☰');
  if(cur.id==='lock') setHint(unlocked.has('key')?LETTER_TEXT.lockHasKey:LETTER_TEXT.lockNoKey);
  if(cur===LETTER) setHint('');

}

  } else if(phase==='draw'){

    } else rips.push({x,y,l:1});

    const inB=x>ox-s*.4&&x<ox+cur.w*s+s*.4&&y>oy-s*.4&&y<oy+cur.h*s+s*.4;

// ----- рисование -----
function pathOf(P,smooth){
  g.beginPath(); const n=P.length, mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  if(!smooth){ g.moveTo(P[0][0],P[0][1]); for(let i=1;i<n;i++) g.lineTo(P[i][0],P[i][1]); g.closePath(); return; }
  const m0=mid(P[n-1],P[0]); g.moveTo(m0[0],m0[1]);
  for(let i=0;i<n;i++){ const m=mid(P[i],P[(i+1)%n]); g.quadraticCurveTo(P[i][0],P[i][1],m[0],m[1]); }
  g.closePath();
}
function drawFig(F,am){
  const P=seq.map(gp);
  g.save(); g.globalAlpha=am*ft; g.shadowColor='rgba('+F.rgb+',.55)'; g.shadowBlur=22; pathOf(P,F.smooth); g.fillStyle=F.col; g.fill(); g.restore();
  g.save(); g.globalAlpha=am; g.lineJoin='round'; g.lineWidth=3; g.strokeStyle=F.ink; pathOf(P,F.smooth); g.stroke(); g.restore();
  g.save(); g.globalAlpha=am*ft; g.lineJoin='round'; g.lineCap='round';
  const C=c=>c==='i'?F.ink:c;
  F.det.forEach(d=>{
    g.beginPath();
    if(d.c){ const q=gp(d.c); g.arc(q[0],q[1],d.r*s,0,6.3); }
    else { d.p.forEach((p,i)=>{const q=gp(p); i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);}); if(d.z) g.closePath(); }
    if(d.f){ g.fillStyle=C(d.f); g.fill(); }
    if(d.k){ g.lineWidth=d.w||2; g.strokeStyle=C(d.k); g.stroke(); }
  });
  g.restore();
  if(F.letters){
    const cy=oy+(F.h/2+.2)*s;
    g.save(); g.globalAlpha=am*Math.max(0,ft*1.4-.4); g.font='italic 600 '+Math.round(s*3.4)+'px "Cormorant Garamond",Georgia,serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle=F.ink; g.shadowColor='rgba('+F.rgb+',.7)'; g.shadowBlur=16;
    g.fillText(F.letters[0],ox-1.7*s,cy); g.fillText(F.letters[1],ox+(F.w+1.7)*s,cy); g.restore();
  }
}

function drawCur(F,am){
  g.save();
  if(F===LETTER&&phase==='done') g.translate(0,Math.sin(clock*2.2)*s*.12);              // письмо слегка покачивается
  if(F.id==='lock'&&shakeT>0) g.translate(Math.sin(shakeT*40)*s*.18*shakeT,0);          // замок «не поддаётся»
  if(F===LETTER) drawLetter(am); else drawFig(F,am);
  g.restore();
}
function drawKey(F,tx,ty,sc,rot,am){   // ключ, закреплённый кончиком в точке (tx,ty)
  const ss=s, so=ox, sy=oy, sq=seq, sf=ft;
  g.save(); g.translate(tx,ty); g.rotate(rot);
  try{ s=sc; ox=-F.w*sc; oy=-F.h*sc/2; seq=F.pts; ft=1; drawFig(F,am); }
  finally{ s=ss; ox=so; oy=sy; seq=sq; ft=sf; g.restore(); }
}
function lockDenied(){ shakeT=1; tone(196,.12,.6); setHint(LETTER_TEXT.lockNoKey); }
function openLock(){ phase='unlock'; unlockT=0; flashed=false; nextB.classList.remove('on'); cap.classList.remove('on'); setHint(''); tone(SC[2],.1,1.2); }
function stepUnlock(dt){   // ключ летит к замочной скважине, поворачивается, замок рассыпается искрами
  unlockT+=dt; const t=unlockT, F=cur, kf=FIGS.find(f=>f.id==='key'), hole=gp([4,5.1]), ease=u=>1-Math.pow(1-u,3);
  const sx=W*.96, sy=H*.8; let tx=hole[0], ty=hole[1], rot=Math.PI, sc=1, am=1;
  if(t<.9){ const u=ease(t/.9); tx=sx+(hole[0]-sx)*u; ty=sy+(hole[1]-sy)*u; rot=Math.PI+(1-u)*.5; }
  else if(t<1.4){ rot=Math.PI+Math.min(1,(t-.9)/.5)*Math.PI/2; sc=1+.04*Math.sin((t-.9)/.5*Math.PI); }
  else rot=Math.PI*1.5;
  if(t>=1.4&&!flashed){ flashed=true; chime(); for(let i=0;i<40;i++){ const q=gp([Math.random()*F.w,Math.random()*F.h]); burst(q[0],q[1],1,F.irgb); } burst(hole[0],hole[1],24,'255,210,80'); }
  if(t>=1.5) am=Math.max(0,1-(t-1.5)/.6);
  const c=gp([F.w/2,F.h/2]), shake=(t>=1.2&&t<1.5)?Math.sin(t*90)*s*.08:0;
  g.save(); g.translate(c[0]+shake,c[1]); g.scale(sc,sc); g.translate(-c[0],-c[1]); drawFig(F,am); g.restore();
  if(kf) drawKey(kf,tx+shake,ty,s*.75,rot,am);
  if(t>=2.2){ startFig(LETTER); openT=0; }   // дальше — письмо
}
function drawLetter(am){   // конверт: закрытый — обычная фигура; при открытии клапан откидывается и выезжает листок
  const F=LETTER;
  if(openT<=0){ drawFig(F,am); return; }
  const k=openT, e=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
  const apex=3.6-5.6*e(Math.min(1,k/.6)), top=1.4-2.6*e(Math.max(0,Math.min(1,(k-.35)/.65)));
  const poly=pts=>{ g.beginPath(); pts.forEach((p,i)=>{const q=gp(p); i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);}); g.closePath(); };
  g.save(); g.globalAlpha=am; g.lineJoin='round'; g.lineCap='round'; g.lineWidth=3; g.strokeStyle=F.ink;
  poly(F.pts); g.fillStyle='#f0e0b0'; g.fill(); g.stroke();                                   // задняя стенка
  if(apex<1){ poly([[0,1],[4,apex],[8,1]]); g.fillStyle='#e9d6a0'; g.fill(); g.stroke(); }  // открытый клапан
  poly([[1,top],[7,top],[7,top+4],[1,top+4]]); g.fillStyle='#fffdf5'; g.fill(); g.lineWidth=2; g.stroke();   // листок
  g.beginPath(); [[2,1],[6,1]].concat([[2,1.8],[6,1.8]],[[2,2.6],[4.6,2.6]]).forEach((p,i)=>{const q=gp([p[0],top+p[1]]); i%2?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);});
  g.strokeStyle='rgba(168,116,58,.5)'; g.stroke();
  g.lineWidth=3; g.strokeStyle=F.ink; poly([[0,1],[4,3.4],[8,1],[8,5],[7,6],[1,6],[0,5]]); g.fillStyle=F.col; g.fill(); g.stroke();   // передняя стенка
  if(apex>=1){ poly([[0,1],[4,apex],[8,1]]); g.fillStyle=F.col; g.fill(); g.stroke(); }                                              // закрытый клапан
  if(k<.45){ g.globalAlpha=am*(1-k/.45); poly(F.det[1].p); g.fillStyle='#ff4d6d'; g.fill(); }                                         // печать-сердечко
  g.restore();
}
function openLetter(){ phase='letterOpen'; openT=0; setHint(''); chime(); }
function buildLetter(){
  lcard.innerHTML='';
  const h=document.createElement('h2'); h.textContent=LETTER_TEXT.title; lcard.appendChild(h);
  LETTER_TEXT.paragraphs.forEach(t=>{ const p=document.createElement('p'); p.textContent=t; lcard.appendChild(p); });
  const sg=document.createElement('p'); sg.className='lsign'; sg.textContent=LETTER_TEXT.sign; lcard.appendChild(sg);
  const b=document.createElement('button'); b.id='lclose'; b.type='button'; b.textContent=LETTER_TEXT.close; b.onclick=closeLetter; lcard.appendChild(b);
}
function showLetter(){ buildLetter(); lcard.scrollTop=0; letterEl.classList.add('on'); }
function closeLetter(){ letterEl.classList.remove('on'); phase='out'; outA=1; }   // письмо закрыто — исчезает и появляется следующий рисунок

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clock+=dt;
  g.setTransform(dpr,0,0,dpr,0,0); g.globalCompositeOperation='source-over'; g.fillStyle='#fbfaf4'; g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(104,150,214,.36)'; g.lineWidth=1; g.beginPath();
  for(let x=((ox%s)+s)%s;x<=W;x+=s){g.moveTo(x+.5,0);g.lineTo(x+.5,H);} for(let y=((oy%s)+s)%s;y<=H;y+=s){g.moveTo(0,y+.5);g.lineTo(W,y+.5);} g.stroke();
  const F=cur;
  if(phase==='idle'){
    const q=gp(seq[0]), k=(clock*.9)%1;
    g.strokeStyle='rgba('+F.irgb+','+(1-k)*.6+')'; g.lineWidth=2; g.beginPath(); g.arc(q[0],q[1],s*(.4+k*1.2),0,6.3); g.stroke();
    g.strokeStyle='rgb('+F.irgb+')'; g.lineWidth=2.5; g.beginPath(); g.arc(q[0],q[1],s*(.42+.07*Math.sin(clock*4.5)),0,6.3); g.stroke();
    g.fillStyle='rgb('+F.irgb+')'; g.beginPath(); g.arc(q[0],q[1],5,0,6.3); g.fill();
  }
  if(phase==='draw'){
    g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#2a3a8c'; g.lineWidth=3;
    for(let i=0;i<placed-1;i++){ const a=gp(seq[i]),b=gp(seq[i+1]); let f=1; if(i===placed-2){ segT=Math.min(1,segT+dt*5); f=1-Math.pow(1-segT,3); }
      g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f); g.stroke(); }
    for(let i=0;i<placed;i++){ const q=gp(seq[i]); g.fillStyle='#2a3a8c'; g.beginPath(); g.arc(q[0],q[1],4.5,0,6.3); g.fill(); }
    const c0=gp(seq[placed-1]), tg=gp(placed<seq.length?seq[placed]:seq[0]), dx=tg[0]-c0[0], dy=tg[1]-c0[1];
    g.setLineDash([7,9]); g.lineDashOffset=-clock*26; g.strokeStyle='rgba('+F.irgb+',.85)'; g.lineWidth=2; g.beginPath(); g.moveTo(c0[0],c0[1]); g.lineTo(tg[0],tg[1]); g.stroke(); g.setLineDash([]);
    g.save(); g.translate(c0[0]+dx*.55,c0[1]+dy*.55); g.rotate(Math.atan2(dy,dx)); g.fillStyle='rgb('+F.irgb+')'; g.beginPath(); g.moveTo(8,0); g.lineTo(-6,-6); g.lineTo(-6,6); g.closePath(); g.fill(); g.restore();
    const r=s*(.3+.08*Math.sin(clock*4.5)); g.strokeStyle='rgb('+F.irgb+')'; g.lineWidth=2.5; g.beginPath(); g.arc(tg[0],tg[1],r,0,6.3); g.stroke();
    g.fillStyle='rgb('+F.irgb+')'; g.beginPath(); g.arc(tg[0],tg[1],4,0,6.3); g.fill();
  }
  if(phase==='done'){ ft=Math.min(1,ft+dt/1.3); shakeT=Math.max(0,shakeT-dt*2.2); drawCur(F,1);
    if(F===LETTER&&ft>=1&&Math.random()<.05){ const q=gp([Math.random()*F.w,Math.random()*F.h]); burst(q[0],q[1],1,'255,200,80'); } }
  if(phase==='out'){ outA=Math.max(0,outA-dt/.5); drawCur(F,outA); if(outA<=0) afterOut(); }
  if(phase==='unlock') stepUnlock(dt);
  if(phase==='letterOpen'){ openT=Math.min(1,openT+dt/1.1); drawLetter(1); if(openT>=1){ phase='letterRead'; showLetter(); } }
  if(phase==='letterRead') drawLetter(1);
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.l-=dt*.9; if(p.l<=0){parts.splice(i,1);continue;}
    g.fillStyle='rgba('+p.c+','+p.l+')'; g.beginPath(); g.arc(p.x,p.y,2.8*p.l+.5,0,6.3); g.fill(); }
  for(let i=rips.length-1;i>=0;i--){ const r=rips[i]; r.l-=dt*2; if(r.l<=0){rips.splice(i,1);continue;} g.strokeStyle='rgba(42,58,140,'+r.l*.5+')'; g.lineWidth=1.5; g.beginPath(); g.arc(r.x,r.y,(1-r.l)*s*.9+4,0,6.3); g.stroke(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
